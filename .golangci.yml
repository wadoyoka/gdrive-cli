version: "2"

run:
  timeout: 5m

issues:
  # 同じ行に複数の linter の指摘があっても depguard の指摘を隠さない
  uniq-by-line: false

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - revive
    - gosec
    - nolintlint
    - unparam
  settings:
    revive:
      # 既定の規則から package-comments だけ外す（アプリなので package コメントは求めない）
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    depguard:
      rules:
        google-api-only-in-repository:
          files:
            - "**/*.go"
            - "!**/internal/repository/**"
          deny:
            - pkg: google.golang.org/api
              desc: Google の API は repository の中だけで使います。ほかの層から使うときは repository を通してください。
            - pkg: golang.org/x/oauth2
              desc: Google の API は repository の中だけで使います。ほかの層から使うときは repository を通してください。
        cobra-only-in-cli:
          files:
            - "**/*.go"
            - "!**/internal/cli/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/spf13/cobra
              desc: cobra は cli と cmd の中だけで使います。
        exec-only-in-repository:
          files:
            - "**/*.go"
            - "!**/internal/repository/**"
          deny:
            - pkg: os/exec
              desc: 外部コマンドの実行は repository の中だけで行います。ほかの層から呼ぶときは repository を通してください。
  exclusions:
    paths:
      - ^trash/
      - ^node_modules/

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wadoyoka/gdrive-cli
  exclusions:
    paths:
      - ^trash/
      - ^node_modules/
